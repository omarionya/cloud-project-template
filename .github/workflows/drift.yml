name: drift

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  drift:
    name: drift ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            plan_role_var: DEV_PLAN_ROLE_ARN
          - env: prod
            plan_role_var: PROD_PLAN_ROLE_ARN
    concurrency:
      group: drift-${{ matrix.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.11" # keep in sync with versions.tf
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.plan_role_var] }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-drift-${{ matrix.env }}-${{ github.run_id }}

      - name: Terraform init
        run: terraform init -lock-timeout=5m

      - name: Terraform plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=10m -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Add result to job summary
        if: steps.plan.outputs.exitcode != ''
        run: |
          {
            echo "### Drift check: ${{ matrix.env }} (exit code ${{ steps.plan.outputs.exitcode }})"
            echo '```'
            head -c 50000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the drift issue
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ matrix.env }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create drift --force --color D93F0B --description "Terraform drift detected"
          title="Drift detected: ${ENV_NAME}"
          existing=$(gh issue list --state open --label drift --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$EXITCODE" = "2" ]; then
            {
              echo "Terraform found differences between \`main\` and the real \`${ENV_NAME}\` account."
              echo
              echo "Run: ${RUN_URL}"
              echo
              echo "<details><summary>Plan output</summary>"
              echo
              echo '```'
              head -c 50000 plan.txt
              echo '```'
              echo "</details>"
            } > body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file body.md
            else
              gh issue create --title "$title" --label drift --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "No drift in the latest check: ${RUN_URL}"
            gh issue close "$existing"
          fi

      - name: Fail the job on drift or error
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "terraform plan exit code: ${{ steps.plan.outputs.exitcode }} (1 = error, 2 = drift)"
          exit 1