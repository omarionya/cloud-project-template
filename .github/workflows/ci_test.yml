name: ci_test

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/**"

permissions:
  id-token: write       # OIDC token for AWS
  contents: read
  pull-requests: write  # post the plan as a PR comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

  plan:
    name: Plan (${{ matrix.env }})
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env == 'dev' && vars.DEV_PLAN_ROLE_ARN || vars.PROD_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color \
            -var-file=${{ matrix.env }}.tfvars \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = 'Plan output not available (an earlier step failed).';
            try { plan = fs.readFileSync(`envs/${env}/plan.txt`, 'utf8'); } catch (e) {}
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... truncated, see the workflow run for the full plan';
            }
            const body = `${marker}\n### Terraform plan: \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }